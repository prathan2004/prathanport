<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin | MH Running App</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script defer src="js/supabase.js?v=20260917-no-evidence"></script>
  <script defer src="js/auth.js?v=20260917-no-evidence"></script>
  <script defer src="js/admin.js?v=20261003-password"></script>
</head>
<body data-protected="true" data-admin="true">
  <header class="app-header">
    <div>
      <p class="eyebrow">Admin</p>
      <h1>จัดการระบบ</h1>
    </div>
    <button id="logoutButton" class="button secondary" type="button">ออกจากระบบ</button>
  </header>

  <nav class="app-nav">
    <a href="dashboard.html">Dashboard</a>
    <a href="add-run.html">บันทึกการวิ่ง</a>
    <a href="history.html">ประวัติ</a>
    <a href="leaderboard.html">Leaderboard</a>
    <a href="challenge.html">Challenge</a>
    <a href="profile.html">Profile</a>
    <a class="active" href="admin.html">Admin</a>
  </nav>

  <main class="app-shell">
    <section class="grid stats-grid">
      <article class="card stat-card"><span>สมาชิก</span><strong id="adminMemberCount">0</strong></article>
      <article class="card stat-card"><span>รอตรวจ</span><strong id="adminPendingCount">0</strong></article>
      <article class="card stat-card"><span>Challenges</span><strong id="adminChallengeCount">0</strong></article>
    </section>

    <section class="grid dashboard-grid">
      <article class="card">
        <div class="section-heading"><div><p class="eyebrow">Review</p><h2>รายการรอตรวจ</h2></div></div>
        <div id="adminPendingRuns" class="run-list"></div>
      </article>
      <article class="card">
        <div class="section-heading"><div><p class="eyebrow">Members</p><h2>สมาชิก</h2></div></div>
        <div id="adminMembers" class="leaderboard-list"></div>
      </article>
    </section>

    <section class="card">
      <div class="section-heading"><div><p class="eyebrow">Challenge</p><h2 id="challengeFormTitle">สร้าง Challenge</h2></div></div>
      <form id="challengeForm" class="form-grid">
        <input id="challengeId" type="hidden">
        <label>ชื่อ Challenge<input id="challengeName" required></label>
        <label>เป้าหมาย (km)<input id="targetDistance" type="number" min="1" step="0.01" required></label>
        <label>วันเริ่ม<input id="startDate" type="date" required></label>
        <label>วันสิ้นสุด<input id="endDate" type="date" required></label>
        <label>Status
          <select id="challengeStatus">
            <option value="draft">Draft</option>
            <option value="active" selected>Active</option>
            <option value="completed">Completed</option>
            <option value="cancelled">Cancelled</option>
          </select>
        </label>
        <label class="span-2">รายละเอียด<input id="challengeDescription"></label>
        <div class="actions compact">
          <button id="challengeSubmitButton" class="button primary" type="submit">สร้าง Challenge</button>
          <button id="challengeCancelButton" class="button secondary" type="button" hidden>ยกเลิก</button>
        </div>
        <p id="adminMessage" class="message"></p>
      </form>
    </section>

    <section class="card">
      <div class="section-heading"><div><p class="eyebrow">Manage</p><h2>Challenge ทั้งหมด</h2></div></div>
      <div id="adminChallengeList" class="run-list"></div>
    </section>

    <section class="card">
      <div class="section-heading">
        <div><p class="eyebrow">Running Records</p><h2>ข้อมูลการวิ่งทั้งหมด</h2></div>
        <button id="clearAllRunsButton" class="button danger" type="button">เคลียร์ข้อมูลทั้งหมด</button>
      </div>
      <div id="adminRunList" class="run-list"></div>
    </section>
  </main>
  <dialog id="adminPasswordDialog">
    <form id="adminPasswordForm" class="profile-form">
      <h2>แก้ไขรหัสผ่านสมาชิก</h2>
      <p id="adminPasswordMember"></p>
      <label>รหัสผ่านใหม่<input id="adminPassword" type="password" autocomplete="new-password" minlength="8" maxlength="128" required></label>
      <label>ยืนยันรหัสผ่านใหม่<input id="adminPasswordConfirm" type="password" autocomplete="new-password" minlength="8" maxlength="128" required></label>
      <div class="actions">
        <button id="adminPasswordSave" class="button primary" type="submit">บันทึกรหัสผ่านใหม่</button>
        <button id="adminPasswordCancel" class="button secondary" type="button">ยกเลิก</button>
      </div>
      <p id="adminPasswordMessage" class="message" role="status" aria-live="polite"></p>
    </form>
  </dialog>
</body>
</html>
