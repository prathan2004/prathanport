<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>สมัครสมาชิก | MH Running App</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script defer src="js/supabase.js"></script>
  <script defer src="js/auth.js"></script>
</head>
<body>
  <main class="auth-shell">
    <form id="registerForm" class="card auth-card">
      <p class="eyebrow">Join The Team</p>
      <h1>สมัครสมาชิก</h1>
      <label>
        ชื่อ-นามสกุล
        <input id="fullName" type="text" autocomplete="name" required>
      </label>
      <label>
        ชื่อที่แสดงใน Leaderboard
        <input id="displayName" type="text" required>
      </label>
      <label>
        อีเมล
        <input id="email" type="email" autocomplete="email" required>
      </label>
      <label>
        รหัสผ่าน
        <input id="password" type="password" autocomplete="new-password" minlength="6" required>
      </label>
      <button class="button primary" type="submit">สมัครสมาชิก</button>
      <p id="authMessage" class="message"></p>
      <p class="muted">มีบัญชีแล้ว? <a href="login.html">เข้าสู่ระบบ</a></p>
    </form>
  </main>
</body>
</html>
