<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>ตั้งรหัสผ่านใหม่ | MH Running App</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script defer src="js/supabase.js?v=20260917-no-evidence"></script>
  <script defer src="js/reset-password.js?v=20261003"></script>
</head>
<body>
  <main class="auth-shell">
    <form id="newPasswordForm" class="card auth-card">
      <p class="eyebrow">MH Running App</p>
      <h1>ตั้งรหัสผ่านใหม่</h1>
      <label>รหัสผ่านใหม่
        <input id="newPassword" type="password" autocomplete="new-password" minlength="8" required disabled>
      </label>
      <label>ยืนยันรหัสผ่านใหม่
        <input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" required disabled>
      </label>
      <button id="savePasswordButton" class="button primary" type="submit" disabled>บันทึกรหัสผ่านใหม่</button>
      <p id="resetMessage" class="message" role="status" aria-live="polite">กำลังตรวจสอบลิงก์...</p>
      <a href="index.html">กลับหน้าเข้าสู่ระบบ</a>
    </form>
  </main>
</body>
</html>
