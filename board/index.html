<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Football Tactics Board</title><style>*{box-sizing:border-box}body{margin:0;background:#101b24;color:#fff;font:16px system-ui,sans-serif}main{max-width:1100px;margin:auto;padding:16px}h1{margin:0;font-size:26px}p{color:#aabdc9}nav{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}button,select,input{font:inherit;background:#263947;color:white;border:1px solid #536777;border-radius:8px;padding:9px;cursor:pointer}button.active{background:#087c59}canvas{width:100%;height:auto;display:block;touch-action:none;border-radius:10px}label{display:flex;align-items:center;gap:6px}input[type=color]{width:44px;height:42px;padding:3px}input[type=text],input[type=number]{max-width:150px}section{background:#192b37;padding:12px;border-radius:12px;margin:12px 0}button:hover{background:#39586a}button:disabled{opacity:.4}#scenes{display:flex;gap:8px;overflow:auto;padding:8px 0}#scenes button{min-width:115px}#status{color:#9fe3bc}canvas{object-fit:contain;max-height:none}h2{font-size:17px;margin:0}</style><main><h1>Football Tactics Board Pro V2.0</h1><p>กระดานวางแผนฟุตบอล • ลากหมากและวาดแท็กติก</p><nav id="tools"><button data-mode="move" class="active">ย้ายหมาก</button><button data-mode="pen">วาดอิสระ</button><button data-mode="arrow">ลูกศร</button><button data-mode="dash">เส้นวิ่ง</button><label>สีเส้น <input id="color" type="color" value="#ffdd44"></label></nav><nav><label>ทีม <select id="team"><option value="0">น้ำเงิน</option><option value="1">แดง</option></select></label><select id="formation"><option>4-4-2</option><option>4-3-3</option><option>3-5-2</option></select><button id="apply">จัดแผน</button><button id="undo">ย้อนกลับ</button><button id="clear">ล้างเส้น</button><button id="reset">เริ่มใหม่</button><button id="save">บันทึก PNG</button></nav><nav><label>มุมสนาม <select id="view"><option value="full">เต็มสนาม</option><option value="halfL">ครึ่งซ้าย</option><option value="halfR">ครึ่งขวา</option><option value="boxL">เขตโทษซ้าย</option><option value="boxR">เขตโทษขวา</option></select></label></nav><canvas id="pitch" width="1050" height="680" aria-label="กระดานฟุตบอล"></canvas><p>เลือกย้ายหมากแล้วลากนักเตะหรือลูกบอล • เลือกเครื่องมือวาดแล้วลากบนสนาม</p><section><h2>Animation & Tactical Scenes</h2><nav><button id="play">▶ Play</button><button id="pause">Ⅱ Pause</button><button id="stop">■ Stop</button><label>ความเร็ว <select id="speed"><option>.5</option><option selected>1</option><option>2</option></select></label><button id="video">Export Video</button></nav><div id="scenes"></div><nav><button id="add">+ ฉากใหม่ (คัดลอก)</button><button id="del">ลบฉาก</button><button id="prev">← ย้ายฉาก</button><button id="next">ย้ายฉาก →</button><label>ชื่อฉาก <input id="sceneName" type="text"></label><label>วินาทีไปฉากถัดไป <input id="duration" type="number" min="0.5" max="30" step="0.5"></label></nav></section><section><h2>Player Editor</h2><nav><select id="player"></select><label>ชื่อ <input id="playerName" type="text" maxlength="30"></label><label>เบอร์ <input id="number" type="number" min="0" max="99"></label><label>สีเสื้อ <input id="shirt" type="color"></label><button id="edit">บันทึกนักเตะ</button></nav></section><section><h2>Save & Load</h2><nav><input id="planName" type="text" placeholder="ชื่อแผน"><button id="store">บันทึกแผน</button><select id="plans"></select><button id="load">เปิดแผน</button><button id="remove">ลบแผน</button></nav><p id="status" role="status"></p></section></main><script>
const $=id=>document.getElementById(id),c=$('pitch'),g=c.getContext('2d');let mode='move',players=[],lines=[],ball={x:525,y:340},history=[],gesture=null;function snapshot(){history.push(JSON.stringify({players,lines,ball}));if(history.length>80)history.shift()}function formation(t,f){let old=players.filter(p=>p.t===t);players=players.filter(p=>p.t!==t);let n=1;[1,...f.split('-').map(Number)].forEach((count,i)=>{for(let j=0;j<count;j++){let x=[75,190,340,460][i];players.push({...old[n-1],t,id:t+":"+n,n:old[n-1]?.n??n,x:t?1050-x:x,y:680*(j+1)/(count+1)});n++}})}function reset(){players=[];lines=[];ball={x:525,y:340};formation(0,'4-4-2');formation(1,'4-4-2')}function circle(x,y,r){g.beginPath();g.arc(x,y,r,0,Math.PI*2)}function stroke(s){let a=s.points;if(a.length<2)return;g.strokeStyle=s.color;g.fillStyle=s.color;g.lineWidth=4;g.lineCap='round';g.lineJoin='round';g.setLineDash(s.mode==='dash'?[12,9]:[]);g.beginPath();g.moveTo(a[0].x,a[0].y);for(let p of a.slice(1))g.lineTo(p.x,p.y);g.stroke();g.setLineDash([]);if(s.mode!=='pen'){let p=a.at(-1),q=a.at(-2),r=Math.atan2(p.y-q.y,p.x-q.x);g.beginPath();g.moveTo(p.x,p.y);g.lineTo(p.x-18*Math.cos(r-.45),p.y-18*Math.sin(r-.45));g.lineTo(p.x-18*Math.cos(r+.45),p.y-18*Math.sin(r+.45));g.closePath();g.fill()}}
function draw(){g.setTransform(1,0,0,1,0,0);g.clearRect(0,0,c.width,c.height);let v=viewport();g.setTransform(c.width/v.w,0,0,c.height/v.h,-v.x*c.width/v.w,-v.y*c.height/v.h);for(let i=0;i<10;i++){g.fillStyle=i%2?'#287c49':'#328b50';g.fillRect(i*105,0,105,680)}g.strokeStyle='#e4f5df';g.lineWidth=3;g.strokeRect(25,25,1000,630);g.beginPath();g.moveTo(525,25);g.lineTo(525,655);g.stroke();circle(525,340,88);g.stroke();for(let t of [0,1]){let x=t?1025:25;g.strokeRect(t?x-165:x,138,165,404);g.strokeRect(t?x-55:x,248,55,184);g.strokeRect(t?x:x-20,303,20,74);circle(t?915:135,340,4);g.fillStyle='white';g.fill()}for(let s of lines)stroke(s);if(gesture?.line)stroke(gesture.line);for(let p of players){circle(p.x,p.y,21);g.fillStyle=p.color||(p.t?'#dc4149':'#2675ed');g.fill();g.strokeStyle='white';g.lineWidth=2;g.stroke();g.fillStyle='white';g.font='bold 19px system-ui';g.textAlign='center';g.textBaseline='middle';g.fillText(p.n,p.x,p.y);if(p.name){g.font="bold 14px system-ui";g.strokeStyle="#15251b";g.lineWidth=4;g.strokeText(p.name,p.x,p.y+33);g.fillText(p.name,p.x,p.y+33)}}circle(ball.x,ball.y,11);g.fillStyle='white';g.fill();g.strokeStyle='#111';g.stroke();circle(ball.x,ball.y,4);g.fillStyle='#111';g.fill()}
function viewport(){return ({full:{x:0,y:0,w:1050,h:680},halfL:{x:0,y:0,w:550,h:680},halfR:{x:500,y:0,w:550,h:680},boxL:{x:0,y:105,w:260,h:470},boxR:{x:790,y:105,w:260,h:470}})[$('view').value]}function pos(e){let r=c.getBoundingClientRect(),v=viewport();return{x:Math.max(12,Math.min(1038,v.x+(e.clientX-r.left)*v.w/r.width)),y:Math.max(12,Math.min(668,v.y+(e.clientY-r.top)*v.h/r.height))}}c.onpointerdown=e=>{if(gesture||playing||paused||recording)return;let p=pos(e);if(mode==='move'){let obj=[ball,...players.slice().reverse()].find(o=>Math.hypot(o.x-p.x,o.y-p.y)<(o===ball?15:24));if(!obj)return;if(obj!==ball){$("player").value=obj.id;showPlayer()}snapshot();gesture={obj,id:e.pointerId}}else{snapshot();gesture={id:e.pointerId,line:{mode,color:$('color').value,points:[p,p]}}}c.setPointerCapture(e.pointerId);draw()};c.onpointermove=e=>{if(!gesture||gesture.id!==e.pointerId)return;let p=pos(e);if(gesture.obj)Object.assign(gesture.obj,p);else if(mode==='arrow')gesture.line.points[1]=p;else gesture.line.points.push(p);draw()};function end(e){if(!gesture||gesture.id!==e.pointerId)return;if(gesture.line)lines.push(gesture.line);gesture=null;draw()}c.onpointerup=end;c.onpointercancel=end;document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(a=>a.classList.toggle('active',a===b))});$('apply').onclick=()=>{snapshot();formation(+$('team').value,$('formation').value);draw()};$('undo').onclick=()=>{if(history.length){({players,lines,ball}=JSON.parse(history.pop()));draw()}};$('clear').onclick=()=>{snapshot();lines=[];draw()};$('reset').onclick=()=>{snapshot();reset();draw()};$('save').onclick=()=>{let a=document.createElement('a');a.download='football-tactics.png';a.href=c.toDataURL('image/png');a.click()};reset();
const clone=x=>JSON.parse(JSON.stringify(x)), state=()=>clone({players,lines,ball});
let scenes=[{name:'ฉาก 1',duration:2,...state()}], index=0, playing=false,paused=false,recording=false,raf=0,elapsed=0,last=0,rec=null,stream=null;
function msg(t){$('status').textContent=t}function commit(){Object.assign(scenes[index],state());scenes[index].name=$('sceneName').value||'ฉาก '+(index+1);scenes[index].duration=Math.max(.5,Math.min(30,Number($('duration').value)||2))}
function showPlayer(){let p=players.find(p=>p.id===$('player').value);if(!p)return;$('playerName').value=p.name||'';$('number').value=p.n;$('shirt').value=p.color||(p.t?'#dc4149':'#2675ed')}
function playerList(){let id=$('player').value;$('player').replaceChildren(...players.map(p=>new Option((p.t?'แดง':'น้ำเงิน')+' '+p.n+' '+(p.name||''),p.id)));if(players.some(p=>p.id===id))$('player').value=id;showPlayer()}
function selectScene(i){index=i;({players,lines,ball}=clone(scenes[i]));history=[];$('sceneName').value=scenes[i].name;$('duration').value=scenes[i].duration;$('scenes').replaceChildren(...scenes.map((s,j)=>{let b=document.createElement('button');b.textContent=(j+1)+'. '+s.name;b.classList.toggle('active',j===i);b.onclick=()=>{if(busy())return;commit();selectScene(j)};return b}));playerList();draw()}
function busy(){return playing||paused||recording||!!gesture}function guard(id,fn){$(id).onclick=()=>{if(!busy())fn()}}
$('player').onchange=showPlayer;guard('edit',()=>{let p=players.find(p=>p.id===$('player').value);if(!p)return;snapshot();p.name=$('playerName').value.trim();p.n=Math.max(0,Math.min(99,Math.round(Number($('number').value)||0)));p.color=$('shirt').value;playerList();draw()});
for(let id of ['apply','undo','clear','reset']){let fn=$(id).onclick;guard(id,()=>{fn();playerList()})}
$('view').onchange=()=>{if(busy())return;resize()};function resize(){let v=viewport();c.width=v.w;c.height=v.h;draw()}
guard('add',()=>{commit();scenes.splice(index+1,0,{...clone(scenes[index]),name:'ฉาก '+(scenes.length+1)});selectScene(index+1)});guard('del',()=>{if(scenes.length===1)return;scenes.splice(index,1);selectScene(Math.min(index,scenes.length-1))});function reorder(d){commit();let j=index+d;if(j<0||j>=scenes.length)return;[scenes[index],scenes[j]]=[scenes[j],scenes[index]];selectScene(j)}guard('prev',()=>reorder(-1));guard('next',()=>reorder(1));
$('sceneName').onchange=()=>{if(!busy()){commit();selectScene(index)}};$('duration').onchange=()=>{if(!busy())commit()};
function lock(on){for(let id of ['view','sceneName','duration','speed','player','playerName','number','shirt'])$(id).disabled=on; $('pause').disabled=recording; $('video').disabled=on}
function frame(t){if(!playing)return;if(last)elapsed+=(t-last)/1000*Number($('speed').value);last=t;let i=0,u=elapsed;while(i<scenes.length-1&&u>=scenes[i].duration){u-=scenes[i].duration;i++}let a=scenes[i],b=scenes[Math.min(i+1,scenes.length-1)],f=Math.min(1,u/a.duration);let mix=(p,q)=>({...p,x:p.x+(q.x-p.x)*f,y:p.y+(q.y-p.y)*f});players=a.players.map(p=>mix(p,b.players.find(q=>q.id===p.id)||p));ball=mix(a.ball,b.ball);lines=a.lines;draw();if(i===scenes.length-1&&u>=a.duration){finish();return}raf=requestAnimationFrame(frame)}
function start(){if(playing)return;if(!paused){commit();elapsed=0}paused=false;playing=true;last=0;lock(true);raf=requestAnimationFrame(frame)}
function finish(){cancelAnimationFrame(raf);playing=false;paused=false;if(rec&&rec.state!=='inactive'){rec.stop()}else{recording=false;lock(false)}selectScene(index)}
$('play').onclick=()=>{if(!gesture&&!recording)start()};$('pause').onclick=()=>{if(playing&&!recording){playing=false;paused=true;cancelAnimationFrame(raf);msg('หยุดชั่วคราว')}};$('stop').onclick=()=>{if(playing||paused)finish()};
function download(blob,name){let url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),10000)}
$('video').onclick=()=>{if(busy())return;if(!c.captureStream||!window.MediaRecorder){msg('เบราว์เซอร์นี้ไม่รองรับการส่งออกวิดีโอ');return}try{let mime=['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm','video/mp4'].find(x=>MediaRecorder.isTypeSupported(x));stream=c.captureStream(30);rec=new MediaRecorder(stream,mime?{mimeType:mime}:{});let chunks=[];rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};rec.onstop=()=>{let type=rec.mimeType||'video/webm';if(chunks.length)download(new Blob(chunks,{type}),'football-tactics.'+(type.includes('mp4')?'mp4':'webm'));stream.getTracks().forEach(t=>t.stop());recording=false;rec=null;lock(false);msg('ส่งออกวิดีโอแล้ว')};rec.onerror=()=>{msg('บันทึกวิดีโอไม่สำเร็จ');finish()};rec.start();recording=true;start();msg('กำลังบันทึกวิดีโอตามเวลาจริง…')}catch(e){stream?.getTracks().forEach(t=>t.stop());recording=false;rec=null;lock(false);msg('ไม่สามารถบันทึกวิดีโอ: '+e.message)}};
const key='football-tactics-pro-v2';function plans(){return JSON.parse(localStorage.getItem(key)||'{}')}function refresh(){try{$('plans').replaceChildren(...Object.keys(plans()).map(n=>new Option(n,n)))}catch(e){msg('ไม่สามารถอ่าน LocalStorage')}}guard('store',()=>{let n=$('planName').value.trim();if(!n){msg('กรุณาตั้งชื่อแผน');return}try{commit();let p=plans();if(Object.hasOwn(p,n)&&!confirm('บันทึกทับแผนเดิม?'))return;Object.defineProperty(p,n,{value:{scenes:clone(scenes),view:$('view').value},enumerable:true,configurable:true,writable:true});localStorage.setItem(key,JSON.stringify(p));refresh();$('plans').value=n;msg('บันทึกแผนแล้ว')}catch(e){msg('บันทึกไม่ได้: '+e.message)}});guard('load',()=>{try{let n=$('plans').value,p=plans()[n];if(!p||!confirm('เปิดแผนนี้แทนแผนปัจจุบัน?'))return;scenes=clone(p.scenes);$('view').value=p.view||'full';$('planName').value=n;selectScene(0);resize();msg('เปิดแผนแล้ว')}catch(e){msg('เปิดแผนไม่ได้')}});guard('remove',()=>{try{let n=$('plans').value;if(!n||!confirm('ลบแผน '+n+'?'))return;let p=plans();delete p[n];localStorage.setItem(key,JSON.stringify(p));refresh();msg('ลบแผนแล้ว')}catch(e){msg('ลบแผนไม่ได้')}});
selectScene(0);refresh();resize();</script></html>
