<!doctype html>
<html lang="th" data-bs-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>เข้าสู่ระบบ | My ShortLink</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/assets/css/style.css">
<script type="module" src="/assets/js/auth.js"></script>
</head>
<body><main class="simple-layout">
<section class="simple-card card"><a class="brand" href="/"><i class="bi bi-link-45deg" aria-hidden="true"></i><span>My ShortLink</span></a>
<h1 class="mt-4">เข้าสู่ระบบ</h1><p class="text-body-secondary mb-4">บัญชีผู้ดูแล My ShortLink</p>
<form id="login-form">
<div id="login-error" class="alert alert-danger" role="alert" hidden></div>
<div class="mb-3"><label class="form-label" for="username">ชื่อผู้ใช้</label><input class="form-control" id="username" name="username" autocomplete="username" maxlength="128" required></div>
<div class="mb-4"><label class="form-label" for="password">รหัสผ่าน</label><input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required></div>
<button type="submit" class="btn btn-primary w-100">เข้าสู่ระบบ</button>
</form></section></main></body>
</html>
