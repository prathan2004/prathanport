<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MQTT Dashboard</title>

  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 760px;
      margin: 40px auto;
      padding: 0 16px;
      background: #f4f6f8;
      color: #1f2933;
    }

    .card {
      background: white;
      padding: 24px;
      border-radius: 8px;
      box-shadow: 0 4px 15px #0002;
    }

    h1 {
      margin-top: 0;
      color: #1976d2;
    }

    .value {
      font-size: 42px;
      font-weight: bold;
      color: #e65100;
      margin: 15px 0;
      word-break: break-word;
    }

    #status {
      padding: 10px;
      background: #eee;
      border-radius: 8px;
      margin-bottom: 20px;
    }

    .meta {
      display: grid;
      grid-template-columns: 120px 1fr;
      gap: 8px 12px;
      margin: 20px 0;
    }

    .meta strong {
      color: #52616b;
    }

    pre {
      background: #222;
      color: #0f0;
      padding: 15px;
      min-height: 120px;
      overflow: auto;
      white-space: pre-wrap;
      border-radius: 8px;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>แดชบอร์ด MQTT</h1>

    <div id="status">กำลังเชื่อมต่อ...</div>

    <div class="meta">
      <strong>Topic</strong>
      <span id="topicName">-</span>
      <strong>เวลาล่าสุด</strong>
      <span id="lastTime">-</span>
    </div>

    <h3>ค่าที่ Subscribe ได้</h3>
    <div class="value">
      <span id="latestValue">-</span>
    </div>

    <h3>ข้อมูลล่าสุด</h3>
    <pre id="log">ยังไม่มีข้อมูล</pre>
  </div>

  <script>
    // แก้ข้อมูลส่วนนี้ให้ตรงกับ HiveMQ Cloud ของคุณ
    const brokerUrl = "wss://b95f18da0ac7417086f1155a81e190ca.s1.eu.hivemq.cloud:8884/mqtt";
    const username = "pcomejina";
    const password = "12345678";
    const topic = "temp";

    const statusElement = document.getElementById("status");
    const topicElement = document.getElementById("topicName");
    const latestValueElement = document.getElementById("latestValue");
    const lastTimeElement = document.getElementById("lastTime");
    const logElement = document.getElementById("log");

    topicElement.textContent = topic;

    const client = mqtt.connect(brokerUrl, {
      username,
      password,
      protocolVersion: 5,
      clean: true,
      reconnectPeriod: 3000,
      connectTimeout: 10000
    });

    client.on("connect", function () {
      statusElement.textContent = "เชื่อมต่อ HiveMQ สำเร็จ กำลัง Subscribe topic...";
      statusElement.style.background = "#c8e6c9";

      client.subscribe(topic, function (error) {
        if (error) {
          statusElement.textContent = "Subscribe ไม่สำเร็จ";
          statusElement.style.background = "#ffcdd2";
          console.error(error);
          return;
        }

        statusElement.textContent = `Subscribe topic "${topic}" สำเร็จ`;
      });
    });

    client.on("message", function (receivedTopic, message) {
      const payload = message.toString();
      const time = new Date().toLocaleString("th-TH");

      latestValueElement.textContent = payload;
      topicElement.textContent = receivedTopic;
      lastTimeElement.textContent = time;
      logElement.textContent =
        `Topic: ${receivedTopic}\n` +
        `ค่า: ${payload}\n` +
        `เวลา: ${time}`;

      console.log("Topic:", receivedTopic);
      console.log("Message:", payload);
    });

    client.on("reconnect", function () {
      statusElement.textContent = "กำลังเชื่อมต่อใหม่...";
      statusElement.style.background = "#fff3cd";
    });

    client.on("error", function (error) {
      statusElement.textContent = "เกิดข้อผิดพลาดในการเชื่อมต่อ";
      statusElement.style.background = "#ffcdd2";
      console.error(error);
    });

    client.on("offline", function () {
      statusElement.textContent = "ออฟไลน์";
      statusElement.style.background = "#ffcdd2";
    });
  </script>
</body>
</html>
