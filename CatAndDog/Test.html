<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animal Classifier</title>

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 560px;
      margin: 40px auto;
      padding: 20px;
      background: #f3f4f6;
      color: #222;
    }

    .card {
      background: white;
      padding: 24px;
      border-radius: 10px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.1);
    }

    h1 {
      text-align: center;
      margin-top: 0;
    }

    input,
    button {
      width: 100%;
      margin-top: 12px;
      padding: 12px;
      font-size: 16px;
      box-sizing: border-box;
    }

    button {
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    button:disabled {
      background: #9ca3af;
      cursor: not-allowed;
    }

    img {
      display: none;
      width: 100%;
      max-height: 300px;
      object-fit: contain;
      margin-top: 16px;
      border: 1px solid #ddd;
      border-radius: 8px;
    }

    .result {
      margin-top: 20px;
      padding: 18px;
      text-align: center;
      background: #eff6ff;
      border-radius: 8px;
    }

    #animalName {
      font-size: 24px;
      font-weight: bold;
    }

    #confidence {
      margin-top: 8px;
      font-size: 30px;
      font-weight: bold;
      color: #2563eb;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>&#3607;&#3634;&#3618;&#3616;&#3634;&#3614;&#3626;&#3633;&#3605;&#3623;&#3660;</h1>

    <p>&#3648;&#3621;&#3639;&#3629;&#3585;&#3619;&#3641;&#3611;&#3616;&#3634;&#3614; &#3649;&#3621;&#3657;&#3623;&#3585;&#3604;&#3611;&#3640;&#3656;&#3617;&#3607;&#3635;&#3609;&#3634;&#3618;&#3612;&#3621;</p>

    <input type="file" id="imageInput" accept="image/*">
    <img id="previewImage" alt="preview">

    <button id="predictButton" disabled>&#3607;&#3635;&#3609;&#3634;&#3618;&#3612;&#3621;</button>

    <div class="result">
      <div id="animalName">&#3585;&#3635;&#3621;&#3633;&#3591;&#3650;&#3627;&#3621;&#3604;&#3650;&#3617;&#3648;&#3604;&#3621;...</div>
      <p>&#3588;&#3623;&#3634;&#3617;&#3617;&#3633;&#3656;&#3609;&#3651;&#3592;</p>
      <div id="confidence">0%</div>
    </div>
  </div>

  <script>
    const MODEL_URL = "https://teachablemachine.withgoogle.com/models/tKIKyM3aQ/";

    let model = null;
    let imageReady = false;

    const imageInput = document.getElementById("imageInput");
    const previewImage = document.getElementById("previewImage");
    const predictButton = document.getElementById("predictButton");
    const animalName = document.getElementById("animalName");
    const confidence = document.getElementById("confidence");

    function showText(text) {
      animalName.textContent = text;
    }

    function convertLabel(label) {
      if (label === "Cat") {
        return "\u0e41\u0e21\u0e27";
      }

      if (label === "Dog") {
        return "\u0e2a\u0e38\u0e19\u0e31\u0e02";
      }

      return label;
    }

    async function loadModel() {
      try {
        const modelURL = MODEL_URL + "model.json";
        const metadataURL = MODEL_URL + "metadata.json";

        model = await tmImage.load(modelURL, metadataURL);
        showText("\u0e42\u0e2b\u0e25\u0e14\u0e42\u0e21\u0e40\u0e14\u0e25\u0e2a\u0e33\u0e40\u0e23\u0e47\u0e08");
        checkReady();
      } catch (error) {
        showText("\u0e42\u0e2b\u0e25\u0e14\u0e42\u0e21\u0e40\u0e14\u0e25\u0e44\u0e21\u0e48\u0e2a\u0e33\u0e40\u0e23\u0e47\u0e08");
        console.log(error);
      }
    }

    imageInput.addEventListener("change", function () {
      const file = imageInput.files[0];

      if (!file) {
        return;
      }

      imageReady = false;
      predictButton.disabled = true;
      confidence.textContent = "0%";
      showText("\u0e01\u0e33\u0e25\u0e31\u0e07\u0e40\u0e1b\u0e34\u0e14\u0e23\u0e39\u0e1b...");

      previewImage.src = URL.createObjectURL(file);
      previewImage.style.display = "block";
    });

    previewImage.addEventListener("load", function () {
      imageReady = true;
      showText("\u0e1e\u0e23\u0e49\u0e2d\u0e21\u0e17\u0e33\u0e19\u0e32\u0e22");
      checkReady();
    });

    function checkReady() {
      predictButton.disabled = !(model && imageReady);
    }

    predictButton.addEventListener("click", async function () {
      try {
        showText("\u0e01\u0e33\u0e25\u0e31\u0e07\u0e17\u0e33\u0e19\u0e32\u0e22...");

        const predictions = await model.predict(previewImage);

        predictions.sort(function (a, b) {
          return b.probability - a.probability;
        });

        const result = predictions[0];

        animalName.textContent = convertLabel(result.className);
        confidence.textContent = (result.probability * 100).toFixed(2) + "%";
      } catch (error) {
        showText("\u0e17\u0e33\u0e19\u0e32\u0e22\u0e44\u0e21\u0e48\u0e2a\u0e33\u0e40\u0e23\u0e47\u0e08");
        console.log(error);
      }
    });

    loadModel();
  </script>
</body>
</html>
