[build]
  command = ""
  publish = "."

[build.environment]
  NODE_VERSION = "24"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/run/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/api/water-level"
  to = "/.netlify/functions/water-level"
  status = 200
