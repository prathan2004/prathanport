<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PT Tools | PRATHAN</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pptxgenjs/3.12.0/pptxgen.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ink: '#17212b',
            mint: '#2fbf9b',
            coral: '#ef6f61',
            paper: '#f7f8f4',
            sky: '#4fa3ff',
            sun: '#f5b841'
          },
          boxShadow: {
            soft: '0 18px 45px rgba(23, 33, 43, 0.12)'
          }
        }
      }
    };
  </script>
</head>
<body class="min-h-screen bg-paper text-ink">
  <main class="mx-auto flex min-h-screen max-w-6xl flex-col px-4 py-5 sm:px-6 lg:px-8">
    <header class="border-b border-ink/10 pb-5">
      <div class="flex items-center justify-between gap-3">
        <div>
          <p class="text-sm font-semibold uppercase tracking-[0.18em] text-mint">PT Tools</p>
          <h1 class="mt-1 text-3xl font-bold sm:text-4xl">PRATHAN Tools</h1>
        </div>
        <button id="menuToggle" class="inline-flex h-11 w-11 items-center justify-center rounded-md border border-ink/10 bg-white shadow-sm lg:hidden" aria-label="เปิดเมนู" aria-expanded="false">
          <span class="grid gap-1.5">
            <span class="block h-0.5 w-5 rounded-full bg-ink"></span>
            <span class="block h-0.5 w-5 rounded-full bg-ink"></span>
            <span class="block h-0.5 w-5 rounded-full bg-ink"></span>
          </span>
        </button>
        <div class="hidden rounded-lg border border-ink/10 bg-white px-4 py-3 text-sm font-semibold shadow-sm sm:block">
          เครื่องมือทั้งหมด: <span id="toolCount" class="text-mint">6</span>
        </div>
      </div>
      <p class="mt-3 max-w-2xl text-sm leading-6 text-ink/70">
        เว็บไซต์รวมเครื่องมือเล็ก ๆ สำหรับใช้งานส่วนตัวของ PRATHAN
      </p>
    </header>

    <div id="mobileOverlay" class="fixed inset-0 z-30 hidden bg-ink/35 lg:hidden"></div>

    <section class="grid flex-1 gap-5 py-5 lg:grid-cols-[260px_1fr]">
      <aside id="toolMenu" class="fixed inset-y-0 left-0 z-40 w-72 -translate-x-full border-r border-ink/10 bg-white p-4 shadow-soft transition-transform lg:static lg:w-auto lg:translate-x-0 lg:rounded-lg lg:border lg:p-3 lg:shadow-sm lg:self-start">
        <div class="mb-4 flex items-center justify-between lg:block">
          <h2 class="px-1 text-sm font-bold">เมนูเครื่องมือ</h2>
          <button id="closeMenu" class="inline-flex h-9 w-9 items-center justify-center rounded-md border border-ink/10 lg:hidden" aria-label="ปิดเมนู">×</button>
        </div>
        <nav id="toolNav" class="grid gap-2"></nav>
      </aside>

      <section class="rounded-lg border border-ink/10 bg-white shadow-soft">
        <div class="border-b border-ink/10 p-4">
          <p id="activeType" class="text-xs font-semibold uppercase tracking-[0.18em] text-coral">Calculator</p>
          <h2 id="activeTitle" class="mt-1 text-2xl font-bold">BMI Calculator</h2>
        </div>

        <div id="toolPanel" class="p-4 md:p-6"></div>
      </section>
    </section>
  </main>

  <template id="bmiTool">
    <div class="grid gap-5">
      <div class="grid gap-4 md:grid-cols-2">
        <label class="grid gap-1 text-sm font-semibold">
          น้ำหนัก (kg)
          <input id="weight" type="number" min="1" step="0.1" value="70" class="field">
        </label>
        <label class="grid gap-1 text-sm font-semibold">
          ส่วนสูง (cm)
          <input id="height" type="number" min="1" step="0.1" value="170" class="field">
        </label>
      </div>

      <button id="calculateBmiButton" class="primary">คำนวณ BMI</button>

      <div class="grid gap-4 rounded-lg border border-ink/10 bg-[#fbfbf8] p-5 sm:grid-cols-[180px_1fr] sm:items-center">
        <div>
          <p class="text-xs font-semibold uppercase tracking-[0.18em] text-ink/50">Result</p>
          <p id="bmiValue" class="mt-2 text-5xl font-black leading-none">24.2</p>
        </div>
        <div>
          <h3 id="bmiLabel" class="text-xl font-bold">น้ำหนักปกติ</h3>
          <p id="bmiDescription" class="mt-2 text-sm leading-6 text-ink/65">ค่านี้เป็นการประเมินเบื้องต้นจากน้ำหนักและส่วนสูง</p>
        </div>
      </div>

      <div class="rounded-lg border border-ink/10 bg-white p-5">
        <div class="flex flex-col gap-2 sm:flex-row sm:items-end sm:justify-between">
          <div>
            <h3 class="text-lg font-bold">BMI Scale</h3>
            <p class="text-sm text-ink/60">เทียบค่าสีตามเกณฑ์ BMI สำหรับเอเชีย</p>
          </div>
          <div class="rounded-md bg-mint/10 px-3 py-2 text-sm font-bold text-mint">
            น้ำหนักปกติ: <span id="healthyWeightRange">53.5 - 66.2 kg</span>
          </div>
        </div>

        <div class="mt-5">
          <div class="relative h-4 overflow-hidden rounded-full bg-ink/10">
            <div class="absolute inset-y-0 left-0 bg-sky" style="width: 46.25%;"></div>
            <div class="absolute inset-y-0 bg-mint" style="left: 46.25%; width: 11.25%;"></div>
            <div class="absolute inset-y-0 bg-sun" style="left: 57.5%; width: 5%;"></div>
            <div class="absolute inset-y-0 bg-coral" style="left: 62.5%; width: 37.5%;"></div>
            <div id="bmiMarker" class="absolute top-1/2 h-7 w-2 -translate-x-1/2 -translate-y-1/2 rounded-full border-2 border-white bg-ink shadow-md" style="left: 60.5%;"></div>
          </div>
          <div class="mt-2 flex justify-between text-xs font-semibold text-ink/45">
            <span>0</span>
            <span>18.5</span>
            <span>23</span>
            <span>25</span>
            <span>40+</span>
          </div>
        </div>

        <div id="scaleList" class="mt-5 grid gap-2 md:grid-cols-2"></div>
      </div>
    </div>
  </template>

  <template id="rctfPromptTool">
    <div class="grid gap-5">
      <div class="rounded-lg border border-ink/10 bg-[#fbfbf8] p-5">
        <h3 class="text-lg font-bold">สร้าง Prompt แบบ RCTF</h3>
        <p class="mt-2 text-sm leading-6 text-ink/65">กรอก Role, Context, Task และ Format ระบบจะรวมเป็น Prompt ที่พร้อมนำไปใช้กับ AI</p>
      </div>

      <div class="grid gap-4 md:grid-cols-2">
        <label class="grid gap-1 text-sm font-semibold">
          Role
          <input id="promptRole" class="field" placeholder="เช่น คุณคือผู้เชี่ยวชาญด้านการสอนคอมพิวเตอร์">
        </label>
        <label class="grid gap-1 text-sm font-semibold">
          Format
          <input id="promptFormat" class="field" placeholder="เช่น ตอบเป็นตาราง Markdown พร้อมตัวอย่าง">
        </label>
      </div>

      <label class="grid gap-1 text-sm font-semibold">
        Context
        <textarea id="promptContext" class="field min-h-[120px] resize-y" placeholder="เช่น นักศึกษาชั้นปีที่ 1 ยังไม่มีพื้นฐานการเขียนโปรแกรม"></textarea>
      </label>

      <label class="grid gap-1 text-sm font-semibold">
        Task
        <textarea id="promptTask" class="field min-h-[120px] resize-y" placeholder="เช่น ช่วยออกแบบกิจกรรมการเรียนรู้เรื่องตัวแปรและชนิดข้อมูล"></textarea>
      </label>

      <div class="flex flex-col gap-2 sm:flex-row">
        <button id="generatePromptButton" class="primary">สร้าง Prompt</button>
        <button id="clearPromptButton" class="secondary">ล้างข้อมูล</button>
      </div>

      <div class="rounded-lg border border-ink/10 bg-white p-4">
        <div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
          <div>
            <h3 class="font-bold">Prompt พร้อมใช้งาน</h3>
            <p id="copyPromptStatus" class="mt-1 text-sm text-ink/60">สร้าง Prompt แล้วกด Copy เพื่อนำไปใช้ต่อ</p>
          </div>
          <button id="copyPromptButton" class="primary">Copy</button>
        </div>
        <textarea id="promptOutput" class="field mt-4 min-h-[260px] resize-y font-mono text-sm leading-6" readonly></textarea>
      </div>
    </div>
  </template>

  <template id="qrCodeTool">
    <div class="grid gap-5">
      <div class="rounded-lg border border-ink/10 bg-[#fbfbf8] p-5">
        <h3 class="text-lg font-bold">QR Code Generator</h3>
        <p class="mt-2 text-sm leading-6 text-ink/65">กรอก URL หรือข้อความ แล้วสร้าง QR Code พร้อมดาวน์โหลดเป็นไฟล์ PNG</p>
      </div>

      <label class="grid gap-1 text-sm font-semibold">
        URL หรือข้อความ
        <textarea id="qrText" class="field min-h-[130px] resize-y" placeholder="เช่น https://example.com หรือข้อความที่ต้องการสร้าง QR Code"></textarea>
      </label>

      <div class="grid gap-4 lg:grid-cols-[1fr_320px] lg:items-start">
        <div class="grid gap-4 rounded-lg border border-ink/10 bg-white p-4">
          <div class="grid gap-4 sm:grid-cols-3">
            <label class="grid gap-1 text-sm font-semibold">
              ขนาด
              <input id="qrSize" type="number" min="120" max="600" step="20" value="260" class="field">
            </label>
            <label class="grid gap-1 text-sm font-semibold">
              สี QR
              <input id="qrDarkColor" type="color" value="#17212b" class="field h-[50px] p-2">
            </label>
            <label class="grid gap-1 text-sm font-semibold">
              สีพื้นหลัง
              <input id="qrLightColor" type="color" value="#ffffff" class="field h-[50px] p-2">
            </label>
          </div>

          <div class="flex flex-col gap-2 sm:flex-row">
            <button id="generateQrButton" class="primary">สร้าง QR Code</button>
            <button id="downloadQrButton" class="secondary">ดาวน์โหลด PNG</button>
            <button id="clearQrButton" class="secondary">ล้างข้อมูล</button>
          </div>

          <p id="qrStatus" class="text-sm text-ink/60">กรอกข้อความเพื่อเริ่มสร้าง QR Code</p>
        </div>

        <div class="rounded-lg border border-ink/10 bg-[#fbfbf8] p-5">
          <div class="mx-auto flex aspect-square w-full max-w-[280px] items-center justify-center rounded-lg border border-dashed border-ink/15 bg-white p-3">
            <div id="qrPreview" class="flex items-center justify-center"></div>
          </div>
        </div>
      </div>
    </div>
  </template>

  <template id="promptPayQrTool">
    <div class="grid gap-5">
      <div class="rounded-lg border border-ink/10 bg-[#fbfbf8] p-5">
        <h3 class="text-lg font-bold">PromptPay QR Generator</h3>
        <p class="mt-2 text-sm leading-6 text-ink/65">สร้าง QR Code สำหรับรับเงินผ่าน PromptPay โดยระบุเบอร์โทรและยอดเงินได้</p>
      </div>

      <div class="grid gap-4 lg:grid-cols-[1fr_320px] lg:items-start">
        <div class="grid gap-4 rounded-lg border border-ink/10 bg-white p-4">
          <div class="grid gap-4 md:grid-cols-2">
            <label class="grid gap-1 text-sm font-semibold">
              เบอร์โทร PromptPay
              <input id="promptPayPhone" class="field" inputmode="tel" placeholder="เช่น 0812345678">
            </label>
            <label class="grid gap-1 text-sm font-semibold">
              ยอดเงิน (บาท)
              <input id="promptPayAmount" type="number" min="0" step="0.01" class="field" placeholder="เว้นว่างได้">
            </label>
          </div>

          <label class="grid gap-1 text-sm font-semibold">
            ชื่อไฟล์
            <input id="promptPayFileName" class="field" value="promptpay-qr">
          </label>

          <div class="flex flex-col gap-2 sm:flex-row">
            <button id="generatePromptPayButton" class="primary">สร้าง PromptPay QR</button>
            <button id="downloadPromptPayButton" class="secondary">ดาวน์โหลด PNG</button>
            <button id="clearPromptPayButton" class="secondary">ล้างข้อมูล</button>
          </div>

          <p id="promptPayStatus" class="text-sm text-ink/60">กรอกเบอร์โทรเพื่อเริ่มสร้าง PromptPay QR</p>
        </div>

        <div class="rounded-lg border border-ink/10 bg-[#fbfbf8] p-5">
          <div class="mx-auto flex aspect-square w-full max-w-[280px] items-center justify-center rounded-lg border border-dashed border-ink/15 bg-white p-3">
            <div id="promptPayPreview" class="flex items-center justify-center"></div>
          </div>
        </div>
      </div>
    </div>
  </template>

  <template id="pdfConvertTool">
    <div class="grid gap-5">
      <div class="rounded-lg border border-ink/10 bg-[#fbfbf8] p-5">
        <h3 class="text-lg font-bold">PDF Converter</h3>
        <p class="mt-2 text-sm leading-6 text-ink/65">แปลง PDF เป็นภาพ PNG, ไฟล์ PPT หรือชุดภาพสำหรับนำไปสร้าง Google Slides</p>
      </div>

      <div class="rounded-lg border border-dashed border-ink/20 bg-[#fbfbf8] p-5">
        <label class="grid cursor-pointer gap-2 text-center">
          <span class="text-lg font-bold">เลือกไฟล์ PDF ที่ต้องการแปลง</span>
          <span class="text-sm text-ink/60">รองรับไฟล์ PDF 1 ไฟล์ต่อครั้ง และประมวลผลในเบราว์เซอร์</span>
          <input id="convertPdfInput" type="file" accept="application/pdf,.pdf" class="sr-only">
          <span class="mx-auto mt-2 rounded-md bg-mint px-4 py-3 text-sm font-extrabold text-white hover:bg-[#28a987]">เลือกไฟล์ PDF</span>
        </label>
      </div>

      <div class="grid gap-4 lg:grid-cols-[1fr_260px]">
        <div class="grid gap-4 rounded-lg border border-ink/10 bg-white p-4">
          <div class="grid gap-4 md:grid-cols-3">
            <label class="grid gap-1 text-sm font-semibold">
              รูปแบบไฟล์
              <select id="convertOutputType" class="field">
                <option value="images">ภาพ PNG (.zip)</option>
                <option value="pptx">PowerPoint (.pptx)</option>
                <option value="google-slides">Google Slides image pack (.zip)</option>
              </select>
            </label>
            <label class="grid gap-1 text-sm font-semibold">
              ความละเอียด
              <select id="convertScale" class="field">
                <option value="1.5">ปกติ</option>
                <option value="2" selected>คมชัด</option>
                <option value="3">คมชัดมาก</option>
              </select>
            </label>
            <label class="grid gap-1 text-sm font-semibold">
              ชื่อไฟล์
              <input id="convertOutputName" class="field" value="converted-pdf">
            </label>
          </div>

          <div class="flex flex-col gap-2 sm:flex-row">
            <button id="convertPdfButton" class="primary">แปลงไฟล์</button>
            <button id="clearConvertPdfButton" class="secondary">ล้างข้อมูล</button>
          </div>

          <p id="convertPdfStatus" class="text-sm text-ink/60">ยังไม่ได้เลือกไฟล์ PDF</p>
        </div>

        <div class="rounded-lg border border-ink/10 bg-[#fbfbf8] p-4">
          <p class="text-xs font-semibold uppercase tracking-[0.18em] text-ink/45">Pages</p>
          <p id="convertPageCount" class="mt-2 text-4xl font-black">0</p>
          <p id="convertFileName" class="mt-2 break-words text-sm text-ink/60">-</p>
        </div>
      </div>

      <div id="convertPreviewList" class="grid gap-3 md:grid-cols-2 xl:grid-cols-3"></div>
    </div>
  </template>

  <template id="pdfTool">
    <div class="grid gap-5">
      <div class="rounded-lg border border-dashed border-ink/20 bg-[#fbfbf8] p-5">
        <label class="grid cursor-pointer gap-2 text-center">
          <span class="text-lg font-bold">เลือกไฟล์ PDF ที่ต้องการรวม</span>
          <span class="text-sm text-ink/60">เลือกได้หลายไฟล์ จากนั้นจัดลำดับก่อนกดรวมไฟล์</span>
          <input id="pdfInput" type="file" accept="application/pdf,.pdf" multiple class="sr-only">
          <span class="mx-auto mt-2 rounded-md bg-mint px-4 py-3 text-sm font-extrabold text-white hover:bg-[#28a987]">เลือกไฟล์ PDF</span>
        </label>
      </div>

      <div class="rounded-lg border border-ink/10 bg-white p-4">
        <div class="flex flex-col gap-2 sm:flex-row sm:items-center sm:justify-between">
          <div>
            <h3 class="font-bold">ลำดับไฟล์</h3>
            <p id="pdfStatus" class="mt-1 text-sm text-ink/60">ยังไม่ได้เลือกไฟล์</p>
          </div>
          <button id="clearPdfFiles" class="secondary">ล้างรายการ</button>
        </div>
        <div id="pdfList" class="mt-4 grid gap-2"></div>
      </div>

      <div class="grid gap-3 sm:grid-cols-[1fr_auto] sm:items-end">
        <label class="grid gap-1 text-sm font-semibold">
          ชื่อไฟล์หลังรวม
          <input id="outputName" class="field" value="merged-prathan-tools.pdf">
        </label>
        <button id="mergePdfButton" class="primary">รวมไฟล์ PDF</button>
      </div>

      <a id="downloadPdf" class="hidden rounded-md border border-mint bg-mint/10 px-4 py-3 text-center text-sm font-extrabold text-mint hover:bg-mint hover:text-white" download>
        ดาวน์โหลดไฟล์ PDF ที่รวมแล้ว
      </a>
    </div>
  </template>

  <template id="splitPdfTool">
    <div class="grid gap-5">
      <div class="rounded-lg border border-dashed border-ink/20 bg-[#fbfbf8] p-5">
        <label class="grid cursor-pointer gap-2 text-center">
          <span class="text-lg font-bold">เลือกไฟล์ PDF หลัก</span>
          <span class="text-sm text-ink/60">เลือก 1 ไฟล์ แล้วระบุหน้าที่ต้องการแยกออกมา</span>
          <input id="splitPdfInput" type="file" accept="application/pdf,.pdf" class="sr-only">
          <span class="mx-auto mt-2 rounded-md bg-mint px-4 py-3 text-sm font-extrabold text-white hover:bg-[#28a987]">เลือกไฟล์ PDF</span>
        </label>
      </div>

      <div class="rounded-lg border border-ink/10 bg-white p-4">
        <h3 class="font-bold">รายละเอียดไฟล์</h3>
        <p id="splitPdfStatus" class="mt-2 text-sm text-ink/60">ยังไม่ได้เลือกไฟล์</p>
      </div>

      <div class="grid gap-4 md:grid-cols-2">
        <label class="grid gap-1 text-sm font-semibold">
          หน้าที่ต้องการแยก
          <input id="pageRanges" class="field" placeholder="เช่น 1,3,5-8">
          <span class="text-xs font-normal leading-5 text-ink/55">ใส่เลขหน้า คั่นด้วย comma หรือช่วงหน้า เช่น 2-5</span>
        </label>
        <label class="grid gap-1 text-sm font-semibold">
          ชื่อไฟล์หลังแยก
          <input id="splitOutputName" class="field" value="split-prathan-tools.pdf">
        </label>
      </div>

      <button id="splitPdfButton" class="primary">แยกไฟล์ PDF</button>

      <a id="downloadSplitPdf" class="hidden rounded-md border border-mint bg-mint/10 px-4 py-3 text-center text-sm font-extrabold text-mint hover:bg-mint hover:text-white" download>
        ดาวน์โหลดไฟล์ PDF ที่แยกแล้ว
      </a>
    </div>
  </template>

  <script>
    const tools = [
      {
        id: 'rctf-prompt',
        title: 'RCTF Prompt Generator',
        type: 'AI Tool',
        description: 'สร้าง Prompt แบบ Role + Context + Task + Format',
        template: 'rctfPromptTool'
      },
      {
        id: 'qr-code',
        title: 'QR Code Generator',
        type: 'Generator',
        description: 'สร้าง QR Code จาก URL หรือข้อความ',
        template: 'qrCodeTool'
      },
      {
        id: 'promptpay-qr',
        title: 'PromptPay QR',
        type: 'Payment QR',
        description: 'สร้าง QR Code PromptPay จากเบอร์โทรและยอดเงิน',
        template: 'promptPayQrTool'
      },
      {
        id: 'pdf-convert',
        title: 'PDF Converter',
        type: 'PDF Tool',
        description: 'แปลง PDF เป็นภาพ, PPT หรือชุดภาพสำหรับ Google Slides',

      const clearPromptButton = document.querySelector('#clearPromptButton');

      function buildPrompt() {
        const role = roleInput.value.trim() || '[ระบุบทบาทของ AI]';
        const context = contextInput.value.trim() || '[ระบุบริบท ข้อมูลพื้นฐาน กลุ่มเป้าหมาย หรือข้อจำกัด]';

        const format = formatInput.value.trim() || '[ระบุรูปแบบคำตอบที่ต้องการ]';

          'Role:',
          role,
          '',
          'Context:',

          '',
          'Task:',
          task,
          '',
          'Format:',
          format
        ].join('\n');
        copyPromptStatus.textContent = 'Prompt พร้อมใช้งานแล้ว';

    function bindQrCodeTool() {
      const qrText = document.querySelector('#qrText');

      const clearQrButton = document.querySelector('#clearQrButton');
      let qrTimer = null;

      function generateQrCode() {
        const text = qrText.value.trim();
        const size = Math.min(Math.max(Number(qrSize.value) || 260, 120), 600);

          qrStatus.textContent = 'ไม่สามารถโหลด qrcodejs ได้ กรุณาเชื่อมต่ออินเทอร์เน็ตแล้วลองใหม่';
          return;
        }

        if (!text) {
          qrStatus.textContent = 'กรุณากรอก URL หรือข้อความ';
          return;
        }

        qrSize.value = size;
        new QRCode(qrPreview, {
          text,
          width: size,
          height: size,
          colorDark: qrDarkColor.value,
          colorLight: qrLightColor.value,
          correctLevel: QRCode.CorrectLevel.H
        });
        qrStatus.textContent = 'QR Code พร้อมใช้งานแล้ว';

    function bindPromptPayQrTool() {
      const promptPayPhone = document.querySelector('#promptPayPhone');
      const promptPayAmount = document.querySelector('#promptPayAmount');
      const promptPayFileName = document.querySelector('#promptPayFileName');
      const promptPayPreview = document.querySelector('#promptPayPreview');
      const promptPayStatus = document.querySelector('#promptPayStatus');
      const generatePromptPayButton = document.querySelector('#generatePromptPayButton');
      const downloadPromptPayButton = document.querySelector('#downloadPromptPayButton');
      const clearPromptPayButton = document.querySelector('#clearPromptPayButton');
      let promptPayTimer = null;

      function emvField(id, value) {
        return `${id}${String(value.length).padStart(2, '0')}${value}`;
      }

      function crc16Ccitt(value) {
        let crc = 0xffff;
        for (let index = 0; index < value.length; index += 1) {
          crc ^= value.charCodeAt(index) << 8;
          for (let bit = 0; bit < 8; bit += 1) {
            crc = (crc & 0x8000) ? ((crc << 1) ^ 0x1021) : (crc << 1);
            crc &= 0xffff;
          }
        }
        return crc.toString(16).toUpperCase().padStart(4, '0');
      }

      function normalizePromptPayPhone(phone) {
        const digits = phone.replace(/\D/g, '');
        if (/^0[689]\d{8}$/.test(digits)) {
          return `0066${digits.slice(1)}`;
        }
        if (/^66[689]\d{8}$/.test(digits)) {
          return `00${digits}`;
        }
        if (/^0066[689]\d{8}$/.test(digits)) {
          return digits;
        }
        throw new Error('phone');
      }

      function buildPromptPayPayload(phone, amount) {
        const proxy = normalizePromptPayPhone(phone);
        const merchantAccount = emvField('00', 'A000000677010111') + emvField('01', proxy);
        const fields = [
          emvField('00', '01'),
          emvField('01', amount ? '12' : '11'),
          emvField('29', merchantAccount),
          emvField('53', '764'),
          amount ? emvField('54', Number(amount).toFixed(2)) : '',
          emvField('58', 'TH')
        ].join('');
        const payloadWithoutCrc = `${fields}6304`;
        return `${payloadWithoutCrc}${crc16Ccitt(payloadWithoutCrc)}`;
      }

      function generatePromptPayQr() {
        const phone = promptPayPhone.value.trim();
        const amountText = promptPayAmount.value.trim();
        promptPayPreview.innerHTML = '';

        if (!window.QRCode) {
          promptPayStatus.textContent = 'ไม่สามารถโหลด qrcodejs ได้ กรุณาเชื่อมต่ออินเทอร์เน็ตแล้วลองใหม่';
          return;
        }

        if (!phone) {
          promptPayStatus.textContent = 'กรุณากรอกเบอร์โทร PromptPay';
          return;
        }

        if (amountText && (!Number.isFinite(Number(amountText)) || Number(amountText) < 0)) {
          promptPayStatus.textContent = 'กรุณากรอกยอดเงินให้ถูกต้อง';
          return;
        }

        try {
          const payload = buildPromptPayPayload(phone, amountText);
          new QRCode(promptPayPreview, {
            text: payload,
            width: 260,
            height: 260,
            colorDark: '#17212b',
            colorLight: '#ffffff',
            correctLevel: QRCode.CorrectLevel.H
          });
          promptPayStatus.textContent = amountText
            ? `PromptPay QR พร้อมใช้งาน ยอด ${Number(amountText).toFixed(2)} บาท`
            : 'PromptPay QR พร้อมใช้งาน แบบไม่ระบุยอดเงิน';
        } catch (error) {
          promptPayStatus.textContent = 'กรุณากรอกเบอร์โทรไทยให้ถูกต้อง เช่น 0812345678';
        }
      }

      function schedulePromptPayQr() {
        clearTimeout(promptPayTimer);
        promptPayTimer = setTimeout(generatePromptPayQr, 250);
      }

      function downloadPromptPayQr() {
        const canvas = promptPayPreview.querySelector('canvas');
        const img = promptPayPreview.querySelector('img');

        if (!canvas && !img) {
          promptPayStatus.textContent = 'กรุณาสร้าง PromptPay QR ก่อนดาวน์โหลด';
          return;
        }

        const fileName = (promptPayFileName.value.trim() || 'promptpay-qr').replace(/[\\/:*?"<>|]+/g, '-');
        const link = document.createElement('a');
        link.href = canvas ? canvas.toDataURL('image/png') : img.src;
        link.download = `${fileName}.png`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        promptPayStatus.textContent = 'ดาวน์โหลด PromptPay QR แล้ว';
      }

      function clearPromptPayQr() {
        promptPayPhone.value = '';
        promptPayAmount.value = '';
        promptPayPreview.innerHTML = '';
        promptPayStatus.textContent = 'ล้างข้อมูลแล้ว';
      }

      promptPayPhone.addEventListener('input', schedulePromptPayQr);
      promptPayAmount.addEventListener('input', schedulePromptPayQr);
      generatePromptPayButton.addEventListener('click', generatePromptPayQr);
      downloadPromptPayButton.addEventListener('click', downloadPromptPayQr);
      clearPromptPayButton.addEventListener('click', clearPromptPayQr);
    }

    function bindPdfConvertTool() {
      const convertPdfInput = document.querySelector('#convertPdfInput');
      const convertOutputType = document.querySelector('#convertOutputType');
      const convertScale = document.querySelector('#convertScale');
      const convertOutputName = document.querySelector('#convertOutputName');
      const convertPdfButton = document.querySelector('#convertPdfButton');
      const clearConvertPdfButton = document.querySelector('#clearConvertPdfButton');
      const convertPdfStatus = document.querySelector('#convertPdfStatus');
      const convertPageCount = document.querySelector('#convertPageCount');
      const convertFileName = document.querySelector('#convertFileName');
      const convertPreviewList = document.querySelector('#convertPreviewList');
      let convertPdfFile = null;

      if (window.pdfjsLib) {
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
      }

      function getOutputBaseName() {
        return (convertOutputName.value.trim() || 'converted-pdf').replace(/[\\/:*?"<>|]+/g, '-');
      }

      function dataUrlToBlob(dataUrl) {
        const [meta, data] = dataUrl.split(',');
        const mime = meta.match(/:(.*?);/)[1];
        const binary = atob(data);
        const bytes = new Uint8Array(binary.length);
        for (let index = 0; index < binary.length; index += 1) {
          bytes[index] = binary.charCodeAt(index);
        }
        return new Blob([bytes], { type: mime });
      }

      function downloadBlob(blob, fileName) {
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = fileName;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
      }

      async function renderPdfPages() {
        if (!window.pdfjsLib) {
          throw new Error('pdfjs-missing');
        }

        const bytes = await convertPdfFile.arrayBuffer();
        const pdf = await pdfjsLib.getDocument({ data: bytes }).promise;
        const scale = Number(convertScale.value) || 2;
        const pages = [];
        convertPreviewList.innerHTML = '';

        for (let pageNumber = 1; pageNumber <= pdf.numPages; pageNumber += 1) {
          convertPdfStatus.textContent = `กำลังแปลงหน้า ${pageNumber} จาก ${pdf.numPages}`;
          const page = await pdf.getPage(pageNumber);
          const viewport = page.getViewport({ scale });
          const canvas = document.createElement('canvas');
          const context = canvas.getContext('2d');
          canvas.width = viewport.width;
          canvas.height = viewport.height;
          await page.render({ canvasContext: context, viewport }).promise;
          const dataUrl = canvas.toDataURL('image/png');
          pages.push({ pageNumber, width: canvas.width, height: canvas.height, dataUrl });

          if (pageNumber <= 6) {
            const preview = document.createElement('div');
            preview.className = 'rounded-lg border border-ink/10 bg-white p-3';
            preview.innerHTML = `
              <img src="${dataUrl}" alt="Page ${pageNumber}" class="mx-auto max-h-52 rounded border border-ink/10 object-contain">
              <p class="mt-2 text-center text-xs font-semibold text-ink/60">Page ${pageNumber}</p>
            `;
            convertPreviewList.appendChild(preview);
          }
        }

        return pages;
      }

      async function downloadImagesZip(pages, fileName) {
        if (!window.JSZip) {
          throw new Error('zip-missing');
        }

        const zip = new JSZip();
        pages.forEach(page => {
          zip.file(`${fileName}-page-${String(page.pageNumber).padStart(3, '0')}.png`, dataUrlToBlob(page.dataUrl));
        });

        if (convertOutputType.value === 'google-slides') {
          zip.file('google-slides-note.txt', 'Upload these PNG files to Google Slides and place each image on a separate slide.');
        }

        const blob = await zip.generateAsync({ type: 'blob' });
        downloadBlob(blob, `${fileName}.zip`);
      }

      async function downloadPptx(pages, fileName) {
        if (!window.pptxgen) {
          throw new Error('pptx-missing');
        }

        const pptx = new pptxgen();
        pptx.layout = 'LAYOUT_WIDE';
        pptx.author = 'PRATHAN Tools';
        pptx.subject = 'PDF converted to slides';
        pptx.title = fileName;
        const slideWidth = 13.333;
        const slideHeight = 7.5;

        pages.forEach(page => {
          const slide = pptx.addSlide();
          slide.background = { color: 'FFFFFF' };
          const imageRatio = page.width / page.height;
          const slideRatio = slideWidth / slideHeight;
          let width = slideWidth;
          let height = slideHeight;
          let x = 0;
          let y = 0;

          if (imageRatio > slideRatio) {
            height = slideWidth / imageRatio;
            y = (slideHeight - height) / 2;
          } else {
            width = slideHeight * imageRatio;
            x = (slideWidth - width) / 2;
          }

          slide.addImage({ data: page.dataUrl, x, y, w: width, h: height });
        });

        await pptx.writeFile({ fileName: `${fileName}.pptx` });
      }

      async function convertPdf() {
        if (!convertPdfFile) {
          convertPdfStatus.textContent = 'กรุณาเลือกไฟล์ PDF ก่อน';
          return;
        }

        convertPdfButton.disabled = true;
        convertPdfButton.textContent = 'กำลังแปลงไฟล์...';

        try {
          const fileName = getOutputBaseName();
          const pages = await renderPdfPages();

          if (convertOutputType.value === 'pptx') {
            await downloadPptx(pages, fileName);
            convertPdfStatus.textContent = `สร้างไฟล์ PPT สำเร็จ ${pages.length} หน้า`;
          } else {
            await downloadImagesZip(pages, fileName);
            convertPdfStatus.textContent = convertOutputType.value === 'google-slides'
              ? `สร้างชุดภาพสำหรับ Google Slides สำเร็จ ${pages.length} หน้า`
              : `สร้างไฟล์ภาพ PNG สำเร็จ ${pages.length} หน้า`;
          }
        } catch (error) {
          if (error.message === 'pdfjs-missing') {
            convertPdfStatus.textContent = 'ไม่สามารถโหลด pdf.js ได้ กรุณาเชื่อมต่ออินเทอร์เน็ตแล้วลองใหม่';
          } else if (error.message === 'pptx-missing') {
            convertPdfStatus.textContent = 'ไม่สามารถโหลด pptxgenjs ได้ กรุณาเชื่อมต่ออินเทอร์เน็ตแล้วลองใหม่';
          } else if (error.message === 'zip-missing') {
            convertPdfStatus.textContent = 'ไม่สามารถโหลด JSZip ได้ กรุณาเชื่อมต่ออินเทอร์เน็ตแล้วลองใหม่';
          } else {
            convertPdfStatus.textContent = 'แปลงไฟล์ไม่สำเร็จ ไฟล์ PDF อาจถูกเข้ารหัสหรือเสียหาย';
          }
        } finally {
          convertPdfButton.disabled = false;
          convertPdfButton.textContent = 'แปลงไฟล์';
        }
      }

      function clearConvertPdf() {
        convertPdfFile = null;
        convertPdfInput.value = '';
        convertPageCount.textContent = '0';
        convertFileName.textContent = '-';
        convertPreviewList.innerHTML = '';
        convertPdfStatus.textContent = 'ล้างข้อมูลแล้ว';
      }

      convertPdfInput.addEventListener('change', async event => {
        convertPdfFile = Array.from(event.target.files || [])[0] || null;
        convertPreviewList.innerHTML = '';

        if (!convertPdfFile) {
          convertPdfStatus.textContent = 'ยังไม่ได้เลือกไฟล์ PDF';
          return;
        }

        if (!(convertPdfFile.type === 'application/pdf' || convertPdfFile.name.toLowerCase().endsWith('.pdf'))) {
          clearConvertPdf();
          convertPdfStatus.textContent = 'กรุณาเลือกไฟล์ PDF เท่านั้น';
          return;
        }

        convertFileName.textContent = convertPdfFile.name;
        convertOutputName.value = convertPdfFile.name.replace(/\.pdf$/i, '') || 'converted-pdf';
        convertPdfStatus.textContent = `เลือกไฟล์แล้ว: ${convertPdfFile.name}`;

        if (window.pdfjsLib) {
          try {
            const bytes = await convertPdfFile.arrayBuffer();
            const pdf = await pdfjsLib.getDocument({ data: bytes }).promise;
            convertPageCount.textContent = pdf.numPages;
            convertPdfStatus.textContent = `พร้อมแปลง ${pdf.numPages} หน้า`;
          } catch (error) {
            convertPageCount.textContent = '?';
            convertPdfStatus.textContent = 'เลือกไฟล์แล้ว แต่ยังอ่านจำนวนหน้าไม่ได้';
          }
        }
      });

      convertPdfButton.addEventListener('click', convertPdf);
      clearConvertPdfButton.addEventListener('click', clearConvertPdf);
    }

    function getBmiCategory(bmi) {
      return bmiScales.find(scale => bmi >= scale.min && bmi < scale.max) || bmiScales[0];
    }

    function calculateHealthyWeightRange(heightMeters) {
      const minWeight = 18.5 * heightMeters * heightMeters;
      const maxWeight = 22.9 * heightMeters * heightMeters;
      return `${minWeight.toFixed(1)} - ${maxWeight.toFixed(1)} kg`;
    }

    function bindBmiTool() {
      const weightInput = document.querySelector('#weight');
      const heightInput = document.querySelector('#height');
      const bmiValue = document.querySelector('#bmiValue');
      const bmiLabel = document.querySelector('#bmiLabel');
      const bmiDescription = document.querySelector('#bmiDescription');
      const bmiMarker = document.querySelector('#bmiMarker');
      const scaleList = document.querySelector('#scaleList');
      const healthyWeightRange = document.querySelector('#healthyWeightRange');

      function renderScaleList(activeLabel) {
        scaleList.innerHTML = bmiScales.map(scale => {
          const isActive = scale.label === activeLabel;
          return `
            <div class="rounded-lg border p-3 ${isActive ? 'border-ink bg-ink text-white' : 'border-ink/10 bg-[#fbfbf8]'}">
              <div class="flex items-center gap-2">
                <span class="h-3 w-3 rounded-full" style="background:${scale.color}"></span>
                <h4 class="text-sm font-bold">${scale.label}</h4>
              </div>
              <p class="mt-2 text-sm font-semibold ${isActive ? 'text-white/90' : 'text-ink/70'}">BMI ${scale.range}</p>
              <p class="mt-1 text-xs leading-5 ${isActive ? 'text-white/70' : 'text-ink/55'}">${scale.description}</p>
            </div>
          `;
        }).join('');
      }

      function calculateBmi() {
        const weight = Number(weightInput.value);
        const heightMeters = Number(heightInput.value) / 100;
        const bmi = weight / (heightMeters * heightMeters);

        if (!Number.isFinite(bmi) || bmi <= 0) {
          bmiValue.textContent = '0.0';
          bmiLabel.textContent = 'กรอกข้อมูลให้ครบ';
          bmiDescription.textContent = 'ใส่น้ำหนักและส่วนสูงเพื่อคำนวณค่า BMI';
          bmiMarker.style.left = '0%';
          healthyWeightRange.textContent = '-';
          renderScaleList('');
          return;
        }

        const category = getBmiCategory(bmi);
        bmiValue.textContent = bmi.toFixed(1);
        bmiLabel.textContent = category.label;
        bmiDescription.textContent = category.description;
        bmiMarker.style.left = `${Math.min((bmi / 40) * 100, 100)}%`;
        healthyWeightRange.textContent = calculateHealthyWeightRange(heightMeters);
        renderScaleList(category.label);
      }

      document.querySelector('#calculateBmiButton').addEventListener('click', calculateBmi);
      weightInput.addEventListener('input', calculateBmi);
      heightInput.addEventListener('input', calculateBmi);
      calculateBmi();
    }

    function bindPdfTool() {
      const pdfInput = document.querySelector('#pdfInput');
      const pdfList = document.querySelector('#pdfList');
      const pdfStatus = document.querySelector('#pdfStatus');
      const mergePdfButton = document.querySelector('#mergePdfButton');
      const clearPdfFiles = document.querySelector('#clearPdfFiles');
      const downloadPdf = document.querySelector('#downloadPdf');
      const outputName = document.querySelector('#outputName');

      function resetDownload() {
        if (mergedPdfUrl) {
          URL.revokeObjectURL(mergedPdfUrl);
          mergedPdfUrl = '';
        }
        downloadPdf.classList.add('hidden');
        downloadPdf.removeAttribute('href');
      }

      function renderPdfList() {
        pdfStatus.textContent = pdfFiles.length ? `เลือกแล้ว ${pdfFiles.length} ไฟล์` : 'ยังไม่ได้เลือกไฟล์';
        pdfList.innerHTML = pdfFiles.length ? pdfFiles.map((file, index) => `
          <div class="grid gap-2 rounded-lg border border-ink/10 bg-[#fbfbf8] p-3 sm:grid-cols-[1fr_auto] sm:items-center">
            <div class="min-w-0">
              <p class="truncate text-sm font-bold">${index + 1}. ${file.name}</p>
              <p class="mt-1 text-xs text-ink/55">${(file.size / 1024 / 1024).toFixed(2)} MB</p>
            </div>
            <div class="grid grid-cols-3 gap-1">
              <button data-move-up="${index}" class="icon-button" title="เลื่อนขึ้น">↑</button>
              <button data-move-down="${index}" class="icon-button" title="เลื่อนลง">↓</button>
              <button data-remove-pdf="${index}" class="icon-button text-coral" title="ลบไฟล์">×</button>
            </div>
          </div>
        `).join('') : '<p class="rounded-lg border border-dashed border-ink/15 p-4 text-sm text-ink/55">ยังไม่มีไฟล์ในรายการ</p>';

        document.querySelectorAll('[data-move-up]').forEach(button => {
          button.addEventListener('click', () => movePdfFile(Number(button.dataset.moveUp), -1));
        });
        document.querySelectorAll('[data-move-down]').forEach(button => {
          button.addEventListener('click', () => movePdfFile(Number(button.dataset.moveDown), 1));
        });
        document.querySelectorAll('[data-remove-pdf]').forEach(button => {
          button.addEventListener('click', () => {
            pdfFiles.splice(Number(button.dataset.removePdf), 1);
            resetDownload();
            renderPdfList();
          });
        });
      }

      function movePdfFile(index, direction) {
        const target = index + direction;
        if (target < 0 || target >= pdfFiles.length) return;
        const [file] = pdfFiles.splice(index, 1);
        pdfFiles.splice(target, 0, file);
        resetDownload();
        renderPdfList();
      }

      async function mergePdfs() {
        resetDownload();

        if (!window.PDFLib) {
          pdfStatus.textContent = 'ไม่สามารถโหลด pdf-lib ได้ กรุณาเชื่อมต่ออินเทอร์เน็ตแล้วลองใหม่';
          return;
        }

        if (pdfFiles.length < 2) {
          pdfStatus.textContent = 'เลือก PDF อย่างน้อย 2 ไฟล์เพื่อรวมไฟล์';
          return;
        }

        mergePdfButton.disabled = true;
        mergePdfButton.textContent = 'กำลังรวมไฟล์...';
        pdfStatus.textContent = 'กำลังประมวลผล PDF ในเบราว์เซอร์';

        try {
          const mergedPdf = await PDFLib.PDFDocument.create();

          for (const file of pdfFiles) {
            const bytes = await file.arrayBuffer();
            const sourcePdf = await PDFLib.PDFDocument.load(bytes);
            const copiedPages = await mergedPdf.copyPages(sourcePdf, sourcePdf.getPageIndices());
            copiedPages.forEach(page => mergedPdf.addPage(page));
          }

          const mergedBytes = await mergedPdf.save();
          const blob = new Blob([mergedBytes], { type: 'application/pdf' });
          mergedPdfUrl = URL.createObjectURL(blob);
          downloadPdf.href = mergedPdfUrl;
          downloadPdf.download = outputName.value.trim() || 'merged-prathan-tools.pdf';
          downloadPdf.classList.remove('hidden');
          pdfStatus.textContent = `รวมไฟล์สำเร็จ ${pdfFiles.length} ไฟล์`;
        } catch (error) {
          pdfStatus.textContent = 'รวมไฟล์ไม่สำเร็จ ไฟล์ PDF บางไฟล์อาจถูกเข้ารหัสหรือเสียหาย';
        } finally {
          mergePdfButton.disabled = false;
          mergePdfButton.textContent = 'รวมไฟล์ PDF';
        }
      }

      pdfInput.addEventListener('change', event => {
        pdfFiles = [...pdfFiles, ...Array.from(event.target.files || [])].filter(file => file.type === 'application/pdf' || file.name.toLowerCase().endsWith('.pdf'));
        pdfInput.value = '';
        resetDownload();
        renderPdfList();
      });
      clearPdfFiles.addEventListener('click', () => {
        pdfFiles = [];
        resetDownload();
        renderPdfList();
      });
      mergePdfButton.addEventListener('click', mergePdfs);
      renderPdfList();
    }

    function bindSplitPdfTool() {
      const splitPdfInput = document.querySelector('#splitPdfInput');
      const splitPdfStatus = document.querySelector('#splitPdfStatus');
      const pageRanges = document.querySelector('#pageRanges');
      const splitOutputName = document.querySelector('#splitOutputName');
      const splitPdfButton = document.querySelector('#splitPdfButton');
      const downloadSplitPdf = document.querySelector('#downloadSplitPdf');

      function resetSplitDownload() {
        if (splitPdfUrl) {
          URL.revokeObjectURL(splitPdfUrl);
          splitPdfUrl = '';
        }
        downloadSplitPdf.classList.add('hidden');
        downloadSplitPdf.removeAttribute('href');
      }

      function parsePageRanges(value, totalPages) {
        const pages = [];
        const seenPages = new Set();
        const parts = value.split(',').map(part => part.trim()).filter(Boolean);

        for (const part of parts) {
          if (part.includes('-')) {
            const [startText, endText] = part.split('-').map(item => item.trim());
            const start = Number(startText);
            const end = Number(endText);
            if (!Number.isInteger(start) || !Number.isInteger(end) || start < 1 || end < start || end > totalPages) {
              throw new Error('page-range');
            }
            for (let page = start; page <= end; page += 1) {
              if (!seenPages.has(page)) {
                seenPages.add(page);
                pages.push(page - 1);
              }
            }
          } else {
            const page = Number(part);
            if (!Number.isInteger(page) || page < 1 || page > totalPages) {
              throw new Error('page-range');
            }
            if (!seenPages.has(page)) {
              seenPages.add(page);
              pages.push(page - 1);
            }
          }
        }

        return pages;
      }

      async function splitPdf() {
        resetSplitDownload();

        if (!window.PDFLib) {
          splitPdfStatus.textContent = 'ไม่สามารถโหลด pdf-lib ได้ กรุณาเชื่อมต่ออินเทอร์เน็ตแล้วลองใหม่';
          return;
        }

        if (!splitPdfFile) {
          splitPdfStatus.textContent = 'กรุณาเลือกไฟล์ PDF หลักก่อน';
          return;
        }

        splitPdfButton.disabled = true;
        splitPdfButton.textContent = 'กำลังแยกไฟล์...';
        splitPdfStatus.textContent = 'กำลังประมวลผล PDF ในเบราว์เซอร์';

        try {
          const bytes = await splitPdfFile.arrayBuffer();
          const sourcePdf = await PDFLib.PDFDocument.load(bytes);
          const totalPages = sourcePdf.getPageCount();
          const selectedPages = parsePageRanges(pageRanges.value, totalPages);

          if (!selectedPages.length) {
            splitPdfStatus.textContent = 'กรุณาระบุหน้าที่ต้องการแยก';
            return;
          }

          const newPdf = await PDFLib.PDFDocument.create();
          const copiedPages = await newPdf.copyPages(sourcePdf, selectedPages);
          copiedPages.forEach(page => newPdf.addPage(page));

          const splitBytes = await newPdf.save();
          const blob = new Blob([splitBytes], { type: 'application/pdf' });
          splitPdfUrl = URL.createObjectURL(blob);
          downloadSplitPdf.href = splitPdfUrl;
          downloadSplitPdf.download = splitOutputName.value.trim() || 'split-prathan-tools.pdf';
          downloadSplitPdf.classList.remove('hidden');
          splitPdfStatus.textContent = `แยกไฟล์สำเร็จ ${selectedPages.length} หน้า จากทั้งหมด ${totalPages} หน้า`;
        } catch (error) {
          splitPdfStatus.textContent = error.message === 'page-range'
            ? 'รูปแบบเลขหน้าไม่ถูกต้อง หรือมีเลขหน้าเกินจำนวนหน้าของไฟล์'
            : 'แยกไฟล์ไม่สำเร็จ ไฟล์ PDF อาจถูกเข้ารหัสหรือเสียหาย';
        } finally {
          splitPdfButton.disabled = false;
          splitPdfButton.textContent = 'แยกไฟล์ PDF';
        }
      }

      splitPdfInput.addEventListener('change', async event => {
        splitPdfFile = Array.from(event.target.files || [])[0] || null;
        resetSplitDownload();

        if (!splitPdfFile) {
          splitPdfStatus.textContent = 'ยังไม่ได้เลือกไฟล์';
          return;
        }

        if (!(splitPdfFile.type === 'application/pdf' || splitPdfFile.name.toLowerCase().endsWith('.pdf'))) {
          splitPdfFile = null;
          splitPdfStatus.textContent = 'กรุณาเลือกไฟล์ PDF เท่านั้น';
          return;
        }

        splitPdfStatus.textContent = `เลือกไฟล์: ${splitPdfFile.name}`;

        if (window.PDFLib) {
          try {
            const sourcePdf = await PDFLib.PDFDocument.load(await splitPdfFile.arrayBuffer());
            splitPdfStatus.textContent = `เลือกไฟล์: ${splitPdfFile.name} (${sourcePdf.getPageCount()} หน้า)`;
          } catch (error) {
            splitPdfStatus.textContent = `เลือกไฟล์: ${splitPdfFile.name} (ยังอ่านจำนวนหน้าไม่ได้)`;
          }
        }
      });

      pageRanges.addEventListener('input', resetSplitDownload);
      splitPdfButton.addEventListener('click', splitPdf);
    }

    menuToggle.addEventListener('click', openMobileMenu);
    closeMenu.addEventListener('click', closeMobileMenu);
    mobileOverlay.addEventListener('click', closeMobileMenu);
    document.querySelector('#toolCount').textContent = tools.length;
    window.addEventListener('hashchange', () => {
      const hashTool = window.location.hash.replace('#', '');
      if (tools.some(tool => tool.id === hashTool)) {
        loadTool(hashTool);
      }
    });
    const initialTool = window.location.hash.replace('#', '');
    loadTool(tools.some(tool => tool.id === initialTool) ? initialTool : 'rctf-prompt');
  </script>
